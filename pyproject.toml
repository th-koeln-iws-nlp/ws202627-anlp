[project]
name = "anlp-ws202627"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.pytest.ini_options]
# baseline.py and ablation_harness.py live in components/, shared by every component
pythonpath = ["components"]

[tool.ruff.lint]
# `import torch.nn as nn` is the Raschka style the course follows
ignore = ["PLR0402"]

[tool.ruff.lint.isort]
# the component tests and starters import these from their own folder or from components/
known-first-party = ["starter", "ablation_harness", "baseline"]

[tool.ruff.lint.per-file-ignores]
# unused imports are intentional here: the tests import them from the starter, the students use them
"components/*/starter.py" = ["F401"]
"solutions/components/*/starter_solution.py" = ["F401"]

